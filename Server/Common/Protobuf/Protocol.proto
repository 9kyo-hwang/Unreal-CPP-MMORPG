syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

// request login to server
message C_LOGIN
{

}

// check if the client's login was successful
message S_LOGIN
{
	bool success = 1;	// login
	repeated Player players = 2;	// before receiving id
}

message C_ENTER
{
	uint64 playerIndex = 1;
}

message S_ENTER
{
	bool success = 1;	// enter
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;	// id talking to
	string msg = 2;
}

